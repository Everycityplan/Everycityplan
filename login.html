<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EveryCityPlan | Log in</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="auth-wrapper">
    <div class="auth-card">
      <p class="eyebrow">Members</p>
      <h1>Welcome back</h1>
      <p>Log in to view your plans and map-ready itineraries.</p>
      <form id="login-form" class="columns" style="gap: 14px;">
        <div class="form-group">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" placeholder="you@example.com" required />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" placeholder="Password" required />
        </div>
        <div class="error" aria-live="polite"></div>
        <button class="button" type="submit">Log in</button>
        <p class="helper-text">Need an account? <a href="signup.html">Sign up</a></p>
      </form>
    </div>

    <script src="app.js"></script>
  </body>
</html>
