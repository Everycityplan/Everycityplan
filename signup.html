<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EveryCityPlan | Sign up</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="auth-wrapper">
    <div class="auth-card">
      <p class="eyebrow">Members</p>
      <h1>Join EveryCityPlan</h1>
      <p>Unlock custom itineraries, maps, and concierge holds.</p>
      <form id="signup-form" class="columns" style="gap: 14px;">
        <div class="form-group">
          <label for="name">Full name</label>
          <input id="name" name="name" type="text" placeholder="Ava Miles" required />
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" placeholder="you@example.com" required />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" placeholder="Min 6 characters" required />
          <small class="helper-text">Passwords are stored hashed in your browser for this mock build.</small>
        </div>
        <div class="error" aria-live="polite"></div>
        <button class="button" type="submit">Create account</button>
        <p class="helper-text">Already have an account? <a href="login.html">Log in</a></p>
      </form>
    </div>

    <script src="app.js"></script>
  </body>
</html>
